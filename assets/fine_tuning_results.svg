<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Fine-tuning results summary</title>
  <desc id="desc">SmolLM2 and Flan-T5 both improved 20 out of 20 held-out examples after QLoRA fine-tuning.</desc>
  <rect width="980" height="360" fill="#f8fafc"/>

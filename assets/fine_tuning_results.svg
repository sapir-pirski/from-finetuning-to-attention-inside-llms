  <text x="64" y="76" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">QLoRA fine-tuning improved every held-out example</text>
  <text x="64" y="108" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="16">Last saved run: Google Colab L4 GPU, 20 test examples, no files or checkpoints written by the notebook.</text>

  <rect x="64" y="146" width="394" height="138" rx="14" fill="#eef6ff" stroke="#bfdbfe"/>
  <text x="92" y="184" fill="#1e3a8a" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">SmolLM2 causal QLoRA</text>
  <text x="92" y="220" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">20 / 20</text>
  <text x="236" y="220" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">examples improved</text>
  <text x="92" y="254" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">F1: 0.217902 -> 0.394910</text>
  <rect x="92" y="266" width="250" height="8" rx="4" fill="#dbeafe"/>
  <rect x="92" y="266" width="172" height="8" rx="4" fill="#2563eb"/>

  <rect x="522" y="146" width="394" height="138" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="550" y="184" fill="#14532d" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Flan-T5 seq2seq QLoRA</text>
  <text x="550" y="220" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">20 / 20</text>
  <text x="694" y="220" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">examples improved</text>
  <text x="550" y="254" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="16">F1: 0.025402 -> 0.278013</text>
